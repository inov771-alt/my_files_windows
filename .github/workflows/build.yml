name: Build MyFiles Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Find project
        id: project
        shell: pwsh
        run: |
          $project = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
          if (-not $project) {
            throw "Файл проекта .csproj не найден"
          }
          "path=$($project.FullName)" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: >
          dotnet publish "${{ steps.project.outputs.path }}"
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MyFiles-Windows-x64
          path: publish/*.exe
